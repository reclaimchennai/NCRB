[project]
name = "ncrb-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "ocrmac>=1.0.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
vlm = [
    "mlx-vlm>=0.7.4",
]
analysis = [
    "plotly>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncrb"]
