[project]
name = "ncrb-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "ocrmac>=1.0.1",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncrb"]
