[project]
name = "ocrkit"
version = "0.1.0"
description = "Read scanned documents with current OCR models on a cloud GPU (Colab), fast and unattended, and pick the best reading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "pillow>=10", "tqdm>=4.60"]

[project.optional-dependencies]
gpu = ["vllm>=0.11"]

[project.scripts]
ocrkit = "ocrkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrkit"]
